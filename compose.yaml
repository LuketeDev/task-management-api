services:
  postgres:
    image: postgres:17-alpine
    container_name: task-management-postgres
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_management
      POSTGRES_PASSWORD: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_management -d task_management"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/task_management
      DB_USERNAME: task_management
      DB_PASSWORD: task_management
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
