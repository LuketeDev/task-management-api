services:
  postgres:
    image: postgres:17-alpine
    container_name: task-manager-postgres
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_management
      POSTGRES_PASSWORD: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_management -d task_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
